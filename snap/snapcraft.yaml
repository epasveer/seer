name: seergdb
title: Seer
summary: A GUI frontend to gdb
description: |
  Seer is a graphical frontend to the GDB debugger that provides a rich
  development environment for debugging programs, including:

  - Source code browsing and breakpoint management
  - Variable inspection and modification
  - Stack frame navigation
  - Memory inspection
  - Assembly view
  - Register view

  Seer runs the host's own gdb and attaches to/launches the programs you
  ask it to debug, so this snap uses classic confinement: it needs
  unrestricted access to the filesystem (to find source and binaries
  anywhere on the system) and to ptrace arbitrary processes, neither of
  which is possible from a strictly confined snap.

website: https://github.com/epasveer/seer
issues: https://github.com/epasveer/seer/issues
license: GPL-3.0-or-later
icon: src/resources/icons/hicolor/256x256/seergdb.png

version: '2.8.1'
base: core24
confinement: classic
grade: stable
compression: lzo

platforms:
  amd64:
    build-on: amd64
    build-for: amd64

apps:
  seergdb:
    command: bin/seergdb-launch
    desktop: usr/share/applications/seergdb.desktop

parts:
  # ---------------------------------------------------------------------
  # Main executable. enable-patchelf stays HERE ONLY, because this is the
  # one file that actually needs its ELF interpreter (PT_INTERP) rewritten
  # so it runs correctly as a classic-confinement snap. Nothing else in
  # this part is dlopen()'d, so patchelf touching it is safe.
  # ---------------------------------------------------------------------
  seergdb:
    plugin: cmake
    source: src
    build-attributes:
      - enable-patchelf          # classic snap: fix the executable's interpreter
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DQTVERSION=QT6
      - -DCMAKE_BUILD_TYPE=Release
      - -DCONFIG_SEER_INSTALL_ICONS=1
    build-packages:
      - qt6-base-dev
      - qt6-charts-dev
      - qt6-svg-dev
      - libgl1-mesa-dev
      - libglx-dev
    stage-packages:
      - libqt6core6t64
      - libqt6gui6t64
      - libqt6widgets6t64
      - libqt6printsupport6t64
      - libqt6charts6
      - libqt6svg6
      - libqt6opengl6t64
      - libqt6openglwidgets6t64
      - libfreetype6              # pin the font stack explicitly, all from noble
      - libharfbuzz0b
      - libfontconfig1
      - libsm6
      - libice6
      - libgl1
      - libglx-mesa0
      - libegl1
    stage:
      - -usr/lib/*/cmake
      - -usr/include
    prime:
      - -usr/lib/*/cmake
      - -usr/include

  # ---------------------------------------------------------------------
  # Qt platform plugins + theme integration + their xcb dependencies.
  # These are ALL loaded via dlopen() at runtime, never exec()'d directly,
  # so they don't need PT_INTERP patched. Deliberately NO enable-patchelf
  # here: patchelf is known to corrupt the PT_NOTE/SHT_NOTE relationship
  # on some ELF files (NixOS/patchelf#217), which breaks Qt's own
  # lightweight ELF metadata parser and makes every plugin report
  # "not a Qt plugin (metadata not found)" at runtime even though the
  # file is otherwise intact. The launcher script's LD_LIBRARY_PATH
  # already resolves these files' dependencies without any RPATH rewrite.
  # ---------------------------------------------------------------------
  qt-plugins:
    plugin: dump
    source: .
    stage-packages:
      - qt6-gtk-platformtheme
      - qt6-qpa-plugins
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxcb-util1
      - libxkbcommon-x11-0
    stage:
      - -usr/lib/*/cmake
      - -usr/include
    prime:
      - -usr/lib/*/cmake
      - -usr/include

  desktop-file:
    plugin: dump
    source: src/resources
    organize:
      seergdb.desktop: usr/share/applications/seergdb.desktop
    stage:
      - usr/share/applications/seergdb.desktop
    prime:
      - usr/share/applications/seergdb.desktop

  launcher:
    plugin: dump
    source: snap/local
    organize:
      launcher.sh: bin/seergdb-launch
